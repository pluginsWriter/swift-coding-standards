# SwiftLint 配置模板 —— 对应《Swift 编码规范》第 3 章（命名）、第 5 章（语言约束）
#
# 分工原则：
#   一切「格式」由 swift-format 负责（仓库根目录 .swift-format）
#   本文件只保留「语义 / 复杂度 / 命名 / 危险 API」类规则
# 因此所有纯格式规则在此显式禁用，避免两套工具给出不一致的结论。

included:
  - Sources
  - Tests

excluded:
  - .build
  - .swiftpm
  - DerivedData

# ---------------------------------------------------------------------------
# 交由 swift-format 全权负责，此处禁用（否则会出现双重标准）
# ---------------------------------------------------------------------------
disabled_rules:
  - trailing_whitespace
  - leading_whitespace
  - trailing_newline
  - opening_brace
  - trailing_comma
  - comma
  - colon
  - statement_position
  - vertical_whitespace
  - vertical_whitespace_between_cases
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - closure_parameter_position
  - closure_spacing
  - closure_end_indentation
  - operator_whitespace
  - operator_usage_whitespace
  - control_statement
  - indentation_width
  - switch_case_alignment
  - mark
  - sorted_imports
  - trailing_semicolon
  - multiple_closures_with_trailing_closure

# ---------------------------------------------------------------------------
# 语义类规则：默认为关闭，本规范强制开启
# ---------------------------------------------------------------------------
opt_in_rules:
  - attributes
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - duplicate_conditions
  - empty_count
  - empty_string
  - empty_xctest_method
  - explicit_init
  - fallthrough
  - fatal_error_message
  - file_name_no_space
  - first_where
  - force_unwrapping
  - identical_operands
  - implicitly_unwrapped_optional
  - last_where
  - legacy_multiple
  - legacy_random
  - lower_acl_than_parent
  - missing_docs
  - modifier_order
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - test_case_accessibility
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - weak_delegate
  - xct_specific_matcher
  - yoda_condition

# ---------------------------------------------------------------------------
# 阈值 —— 与 .swift-format 的 lineLength 必须保持一致（统一 120 列）
# ---------------------------------------------------------------------------
line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true
  ignores_function_declarations: false

file_length:
  warning: 700
  error: 1200
  ignore_comment_only_lines: true

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 60
  error: 100

function_parameter_count:
  warning: 6
  error: 8

cyclomatic_complexity:
  warning: 15
  error: 25

nesting:
  type_level:
    warning: 3
  function_level:
    warning: 5

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  # 与正文 3.5 对齐：标准短名与循环变量（其余单字母仍被禁止）
  excluded:
    - id
    - ids
    - x
    - y
    - z
    - u
    - t
    - v
    - a
    - b
    - i
    - j

type_name:
  min_length:
    warning: 3
  max_length:
    warning: 50
    error: 60

# ---------------------------------------------------------------------------
# 个别规则的分级
# ---------------------------------------------------------------------------
force_cast: error
force_try: error
todo:
  severity: warning
